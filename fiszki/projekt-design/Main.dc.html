<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Fiszki — start</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Barlow:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#D6EA3C}a:hover{color:#E8F57A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: radial-gradient(120% 80% at 40% 35%, #263334 0%, #1C2627 60%, #182122 100%); font-family: Barlow, system-ui, sans-serif; color: #E6EDEA; display: flex; flex-direction: column; position: relative; overflow: hidden">

  <div style="position: absolute; left: -40px; top: 120px; width: 260px; height: 1px; background: #3A4A4B; transform: rotate(-45deg)"></div>
  <div style="position: absolute; right: -60px; bottom: 300px; width: 300px; height: 1px; background: #3A4A4B; transform: rotate(-45deg)"></div>
  <div style="position: absolute; left: 6px; top: 330px; font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 1px; color: #6F8180; transform: rotate(-90deg); transform-origin: left top">CAP_REVIEW // 0x1B</div>
  <div style="position: absolute; left: 8px; top: 36px; width: 3px; height: 40px; background: #D6EA3C"></div>

  <div style="padding: 28px 20px 0 24px; display: flex; justify-content: space-between; align-items: flex-start">
    <div style="display: flex; flex-direction: column; gap: 4px">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8A9C9B; letter-spacing: 1px">SYS://FISZKI_v0.1</span>
      <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 38px; font-weight: 700; line-height: 1; letter-spacing: 0.5px">TWOJE FISZKI</h1>
    </div>
    <div style="background: #D6EA3C; color: #141A12; clip-path: polygon(12px 0, 100% 0, 100% 100%, 0 100%, 0 12px); padding: 8px 12px 8px 16px; display: flex; flex-direction: column; align-items: flex-end">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 9px; font-weight: 700; letter-spacing: 1px">STREAK</span>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 700; line-height: 1">12 DNI</span>
    </div>
  </div>

  <div style="margin: 20px 20px 0; background: #34C3AE; color: #0F1A1A; clip-path: polygon(22px 0, 100% 0, 100% calc(100% - 22px), calc(100% - 22px) 100%, 0 100%, 0 22px); padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 12px; position: relative">
    <div style="display: flex; justify-content: space-between; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 1px">
      <span>_QUEUE.TODAY</span>
      <span>[18/45]</span>
    </div>
    <div style="font-family: 'Barlow Condensed', sans-serif; font-size: 56px; font-weight: 700; line-height: 0.9">27 KART</div>
    <div style="display: grid; grid-template-columns: repeat(10, minmax(0, 1fr)); gap: 4px">
      <div style="height: 8px; background: #0F1A1A"></div><div style="height: 8px; background: #0F1A1A"></div><div style="height: 8px; background: #0F1A1A"></div><div style="height: 8px; background: #0F1A1A"></div>
      <div style="height: 8px; background: rgba(15,26,26,0.25)"></div><div style="height: 8px; background: rgba(15,26,26,0.25)"></div><div style="height: 8px; background: rgba(15,26,26,0.25)"></div><div style="height: 8px; background: rgba(15,26,26,0.25)"></div><div style="height: 8px; background: rgba(15,26,26,0.25)"></div><div style="height: 8px; background: rgba(15,26,26,0.25)"></div>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 4px">
      <a href="Study.dc.html" style="background: #0F1A1A; color: #D6EA3C; text-decoration: none; font-family: 'JetBrains Mono', monospace; font-weight: 700; font-size: 13px; letter-spacing: 1px; clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); padding: 0 20px; min-height: 46px; display: flex; align-items: center; gap: 10px">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M5 3l16 9-16 9z"></path></svg>
        START_SESJI
      </a>
      <div style="width: 64px; height: 22px; background: repeating-linear-gradient(-45deg, #0F1A1A 0 4px, transparent 4px 9px)"></div>
    </div>
  </div>

  <div style="padding: 24px 20px 10px 24px; display: flex; justify-content: space-between; align-items: baseline">
    <h2 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-size: 24px; font-weight: 700; letter-spacing: 0.5px">TALIE</h2>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8A9C9B">/DECKS [04]</span>
  </div>

  <div style="flex: 1; padding: 0 20px 96px; display: flex; flex-direction: column; gap: 10px; overflow: hidden">
    <sc-for list="{{decks}}" as="d" hint-placeholder-count="4">
      <a href="Study.dc.html" style="background: #47585A; padding: 1px; clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px); text-decoration: none; color: #E6EDEA; display: block">
        <div style="background: #1E2829; clip-path: polygon(11.6px 0, 100% 0, 100% calc(100% - 11.6px), calc(100% - 11.6px) 100%, 0 100%, 0 11.6px); padding: 12px 14px; display: flex; align-items: center; gap: 14px; min-height: 64px; box-sizing: border-box">
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; font-weight: 700; color: #34C3AE; width: 40px">[{{d.short}}]</span>
          <div style="flex: 1; display: flex; flex-direction: column; gap: 2px; min-width: 0">
            <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 20px; line-height: 1.1; letter-spacing: 0.3px">{{d.name}}</span>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8A9C9B">{{d.total}} KART // {{d.path}}</span>
          </div>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #141A12; background: #D6EA3C; padding: 4px 8px; min-width: 22px; text-align: center">{{d.due}}</span>
        </div>
      </a>
    </sc-for>
  </div>

  <a href="AddCard.dc.html" aria-label="Dodaj fiszkę" style="position: absolute; right: 20px; bottom: 96px; width: 58px; height: 58px; background: #D6EA3C; color: #141A12; clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px); display: flex; align-items: center; justify-content: center">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="square"><path d="M12 5v14M5 12h14"></path></svg>
  </a>

  <nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; background: #182122; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border-top: 1px solid #3A4A4B">
    <a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-decoration: none; color: #D6EA3C; font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 1px; position: relative">
      <span style="position: absolute; top: -1px; left: 30%; right: 30%; height: 3px; background: #D6EA3C"></span>
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="miter"><path d="M4 9l3-3h10v14H4z"></path><path d="M9 3h11v12"></path></svg>
      TALIE
    </a>
    <a href="Stats.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-decoration: none; color: #8A9C9B; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 1px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="square"><path d="M5 20V11M12 20V5M19 20v-6"></path></svg>
      STATY
    </a>
    <a href="Theme.dc.html" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-decoration: none; color: #8A9C9B; font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 1px">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 3h10l4 4v10l-4 4H7l-4-4V7z"></path><path d="M12 7v10M7 12h10"></path></svg>
      WYGLĄD
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    return {
      decks: [
        { name: 'ANGIELSKI B2', short: 'EN', total: 320, due: 14, path: '/LANG/EN' },
        { name: 'HISZPAŃSKI — PODSTAWY', short: 'ES', total: 150, due: 6, path: '/LANG/ES' },
        { name: 'SIECI KOMPUTEROWE', short: 'NET', total: 96, due: 5, path: '/IT/TCP' },
        { name: 'MATEMATYKA DYSKRETNA', short: 'MD', total: 58, due: 2, path: '/STUDIA' }
      ]
    };
  }
}
</script>
</body>
</html>
