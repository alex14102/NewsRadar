<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Fiszki — nauka</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&amp;family=Barlow:wght@400;500;600&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#D6EA3C}a:hover{color:#E8F57A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: radial-gradient(120% 80% at 50% 40%, #263334 0%, #1C2627 60%, #182122 100%); font-family: Barlow, system-ui, sans-serif; color: #E6EDEA; display: flex; flex-direction: column; position: relative; overflow: hidden">

  <div style="position: absolute; right: 8px; top: 260px; font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 1px; color: #6F8180; transform: rotate(90deg); transform-origin: right top; white-space: nowrap">SRS_ALGO // SM-2</div>

  <div style="padding: 20px 16px 0; display: flex; align-items: center; gap: 8px">
    <a href="Main.dc.html" aria-label="Wróć" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #E6EDEA">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="square"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    <div style="flex: 1; display: flex; flex-direction: column">
      <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #8A9C9B; letter-spacing: 1px">/LANG/EN</span>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: 0.5px; line-height: 1.1">ANGIELSKI B2</span>
    </div>
    <span style="font-family: 'JetBrains Mono', monospace; font-size: 13px; font-weight: 700; color: #D6EA3C; padding-right: 8px">{{counter}}</span>
  </div>

  <div style="margin: 14px 20px 0; height: 4px; background: #2E3B3C; position: relative">
    <div style="position: absolute; left: 0; top: 0; bottom: 0; width: {{progress}}; background: #D6EA3C"></div>
  </div>

  <div style="flex: 1; padding: 22px 20px 0; display: flex; flex-direction: column">
    <div style="background: #47585A; padding: 1px; clip-path: polygon(28px 0, 100% 0, 100% calc(100% - 28px), calc(100% - 28px) 100%, 0 100%, 0 28px); flex: 1; display: flex">
      <div style="flex: 1; background: #1E2829; clip-path: polygon(27.6px 0, 100% 0, 100% calc(100% - 27.6px), calc(100% - 27.6px) 100%, 0 100%, 0 27.6px); display: flex; flex-direction: column; position: relative">
        <div style="position: absolute; left: 0; top: 0; width: 28px; height: 28px; background: #34C3AE; clip-path: polygon(0 0, 100% 0, 0 100%)"></div>
        <div style="position: absolute; right: 18px; top: 18px; width: 48px; height: 14px; background: repeating-linear-gradient(-45deg, #D6EA3C 0 3px, transparent 3px 7px)"></div>

        <div style="padding: 30px 24px 0; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: #8A9C9B; letter-spacing: 1px">_FRONT // EN</div>
        <div style="flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 0 24px; gap: 8px">
          <div style="font-family: 'Barlow Condensed', sans-serif; font-size: 60px; font-weight: 700; line-height: 0.95; text-transform: uppercase">{{card.front}}</div>
          <div style="font-family: 'JetBrains Mono', monospace; font-size: 14px; color: #34C3AE">{{card.ipa}}</div>
        </div>

        <sc-if value="{{flipped}}" hint-placeholder-val="{{ false }}">
          <div style="margin: 0 12px 12px; background: #34C3AE; color: #0F1A1A; clip-path: polygon(0 0, 100% 0, 100% calc(100% - 18px), calc(100% - 18px) 100%, 0 100%); padding: 16px 18px 20px; display: flex; flex-direction: column; gap: 8px">
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 700; letter-spacing: 1px">_BACK // PL</span>
            <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 34px; font-weight: 700; line-height: 1">{{card.back}}</span>
            <span style="font-size: 15px; font-weight: 500; font-style: italic">{{card.ex}}</span>
          </div>
        </sc-if>
      </div>
    </div>
  </div>

  <div style="padding: 16px 20px 28px">
    <sc-if value="{{notFlipped}}" hint-placeholder-val="{{ true }}">
      <button type="button" onClick="{{flip}}" style="width: 100%; min-height: 58px; border: 0; cursor: pointer; background: #D6EA3C; color: #141A12; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 700; letter-spacing: 1.5px; clip-path: polygon(14px 0, 100% 0, 100% calc(100% - 14px), calc(100% - 14px) 100%, 0 100%, 0 14px)">POKAŻ_ODPOWIEDŹ</button>
    </sc-if>
    <sc-if value="{{flipped}}" hint-placeholder-val="{{ false }}">
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px">
        <sc-for list="{{rates}}" as="r" hint-placeholder-count="4">
          <button type="button" onClick="{{r.pick}}" style="{{r.style}}">
            <span style="font-family: 'Barlow Condensed', sans-serif; font-size: 18px; font-weight: 700; letter-spacing: 0.5px">{{r.label}}</span>
            <span style="font-family: 'JetBrains Mono', monospace; font-size: 11px">{{r.time}}</span>
          </button>
        </sc-for>
      </div>
    </sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { i: 0, flipped: false, done: 11 };
  }
  renderVals() {
    const cards = [
      { front: 'reluctant', ipa: '/rɪˈlʌk.tənt/', back: 'niechętny, oporny', ex: 'She was reluctant to admit her mistake.' },
      { front: 'thorough', ipa: '/ˈθʌr.ə/', back: 'dokładny, gruntowny', ex: 'The audit was thorough.' },
      { front: 'to deploy', ipa: '/dɪˈplɔɪ/', back: 'wdrożyć', ex: 'We deploy the app on Friday.' }
    ];
    const base = 'min-height: 64px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px); ';
    const defs = [
      { label: 'ZNOWU', time: '<1M', style: base + 'background: #2E3B3C; color: #E6EDEA; border: 0' },
      { label: 'TRUDNE', time: '6M', style: base + 'background: #2E3B3C; color: #E6EDEA; border: 0' },
      { label: 'DOBRZE', time: '1D', style: base + 'background: #34C3AE; color: #0F1A1A; border: 0' },
      { label: 'ŁATWE', time: '4D', style: base + 'background: #D6EA3C; color: #141A12; border: 0' }
    ];
    const s = this.state;
    const next = () => this.setState({ i: (s.i + 1) % cards.length, flipped: false, done: Math.min(s.done + 1, 23) });
    return {
      card: cards[s.i],
      flipped: s.flipped,
      notFlipped: !s.flipped,
      flip: () => this.setState({ flipped: true }),
      rates: defs.map((d) => ({ ...d, pick: next })),
      counter: (s.done + 1) + '/24',
      progress: Math.round(((s.done + 1) / 24) * 100) + '%'
    };
  }
}
</script>
</body>
</html>
